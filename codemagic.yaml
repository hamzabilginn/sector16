workflows:
  android-release:
    name: Sector 16 Android AAB
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 24
      java: 21
      android_signing:
        - sector16_upload
    scripts:
      - name: Install and test
        script: |
          npm ci --include=dev
          npm test
          npm run build:mobile
          npx cap sync android
      - name: Signed release
        script: |
          export SECTOR16_KEYSTORE="$CM_KEYSTORE_PATH"
          export SECTOR16_STORE_PASSWORD="$CM_KEYSTORE_PASSWORD"
          export SECTOR16_KEY_PASSWORD="$CM_KEY_PASSWORD"
          export SECTOR16_KEY_ALIAS="$CM_KEY_ALIAS"
          export BUILD_NUMBER=$(( ${PROJECT_BUILD_NUMBER:-1} + 1 ))
          chmod +x android/gradlew
          cd android
          ./gradlew bundleRelease assembleRelease --no-daemon
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/apk/release/*.apk
  ios-release:
    name: Sector 16 App Store IPA
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      node: 24
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.webdehasi.sector16
    scripts:
      - name: Install and test
        script: |
          npm ci --include=dev
          npm test
          npm run build:mobile
          npx cap sync ios
      - name: Version and signing
        script: |
          cd ios/App
          agvtool new-version -all $(( ${PROJECT_BUILD_NUMBER:-1} + 1 ))
          cd ../..
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
  ios-upload:
    name: Sector 16 - Upload to App Store Connect
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      node: 24
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.webdehasi.sector16
    scripts:
      - name: Install and test
        script: |
          npm ci --include=dev
          npm test
          npm run build:mobile
          npx cap sync ios
      - name: Version and signing
        script: |
          cd ios/App
          agvtool new-version -all $(( ${PROJECT_BUILD_NUMBER:-1} + 1 ))
          cd ../..
          xcode-project use-profiles
      - name: Build signed IPA
        script: |
          xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    integrations:
      app_store_connect: sector16_app_store
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
